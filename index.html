<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenmart</title>
    <link rel="stylesheet" href="./public/css/command.css" />

    <link rel="stylesheet" href="./public/css/home.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="navbar_frame">
      <div class="container">
        <div class="navbar_top">
          <a href="./index.html">
            <img src="./public/images/icons/logo.png" />
          </a>
          <div class="nav_search_frame">
            <!-- 1-qism -->
            <!--  -->
            <div class="search_box">
              <div class="category_list">
                <select name="" id="">
                  <option value="all" selected>All Categories</option>
                  <option value="computer">Computers</option>
                </select>
              </div>
              <input type="text" placeholder="Search for products..." />
            </div>
            <!-- 2- qism -->
            <div class="search_icon_box">
              <img src="./public/images/icons/search.svg" />
            </div>
          </div>
          <div class="nav_top_menu">
            <!-- 1- wish list  -->
            <d class="top_menu_box">
              <d class="box_icon_box">
                <img src="./public/images/icons/heart.svg" />
              </d>
              <d class="box_info_box">
                <span>Wishlist</span>
                <strong>My items</strong>
              </d>
            </d>
            <!-- 2-  sign in -->
            <d class="top_menu_box">
              <d class="box_icon_box">
                <img src="./public/images/icons/profile.svg" />
              </d>
              <d class="box_info_box">
                <span>Sign In</span>
                <strong>Account</strong>
              </d>
            </d>
            <!-- 3- total -->
            <d class="top_menu_box">
              <d class="box_icon_box">
                <div class="basket_count">2</div>
                <img src="./public/images/icons/shopping-cart.svg" />
              </d>
              <d class="box_info_box">
                <span>$200.99</span>
                <strong>Total</strong>
              </d>
            </d>
          </div>
        </div>

        <!-- pastki qism -->
        <div class="navbar_bott">
          <div class="navbar_bott_menu_box">
            <div class="browse_box">
              <img src="./public/images/icons/browse.svg" alt="" />
              <span>Browse Categories</span>
            </div>

            <div class="navbar_route_menyu">
              <a href="" class="title">Home</a>
              <a href="">Shop</a>
              <a href="">Orders</a>
              <a href="">Abouts</a>
              <a href="">Contact</a>
            </div>

            <div class="sorting_menu">
              <span>Deal of the Day</span>
              <span> Hot Deals</span>
              <span> Best Sellers</span>
              <span>New Arrivals</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
